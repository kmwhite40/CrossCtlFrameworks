[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf"
version = "0.1.0"
description = "Concord — NIST SP 800-53A Rev 5 + cross-framework control mappings platform"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Concord" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "structlog>=24.1,<25",
    "python-slugify>=8.0,<9",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "prometheus-client>=0.20,<1",
    "slowapi>=0.1.9,<1",
    "aiosqlite>=0.20,<1",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-python-slugify",
]
reader = [
    "pyinstaller>=6.10,<7",
]
# AWS GovCloud config-capture connector (boto3 auto-resolves the aws-us-gov
# partition from CCF_AWS_REGION, e.g. us-gov-west-1). Install: pip install -e ".[aws]"
aws = [
    "boto3>=1.34,<2",
]

[project.scripts]
ccf = "ccf.cli:app"
concord-reader = "ccf.reader.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ccf.api" = ["templates/*.html", "static/**/*"]
"ccf.scoring" = ["seed.json"]
"ccf.fedramp20x" = ["ksi_catalog.json", "oscal_ksi.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored third-party Claude Code skills are not part of our codebase.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "PL", "RUF"]
ignore = ["B008", "PLR0913", "PLR2004", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"src/ccf/db.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_client", "slowapi", "slowapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Browser e2e tests are opt-in (they run a live server + Chromium). Run with
# `pytest -m e2e`; the default suite excludes them.
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: browser end-to-end tests (live server + Playwright; run with -m e2e)",
]
