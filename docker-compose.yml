name: ccf

x-ccf-env: &ccf_env
  CCF_DATABASE_URL: postgresql+asyncpg://ccf:ccf@db:5432/ccf
  CCF_DATABASE_URL_SYNC: postgresql+psycopg://ccf:ccf@db:5432/ccf
  CCF_LOG_LEVEL: INFO
  CCF_LOG_JSON: "false"
  CCF_WORKBOOK_PATH: /data/NIST Cross Mappings Rev. 1.1.xlsx

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ccf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccf
      POSTGRES_PASSWORD: ccf
      POSTGRES_DB: ccf
    ports: ["5433:5432"]
    volumes: ["ccf_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccf -d ccf"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build: .
    container_name: ccf-migrator
    depends_on:
      db: { condition: service_healthy }
    environment: *ccf_env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"

  api:
    build: .
    container_name: ccf-api
    depends_on:
      db:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment: *ccf_env
    ports: ["8088:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  etl:
    build: .
    container_name: ccf-etl
    profiles: ["etl"]
    depends_on:
      db:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment: *ccf_env
    volumes: ["./data:/data:ro"]
    entrypoint: ["ccf"]
    command: ["ingest"]
    restart: "no"

  cli:
    build: .
    container_name: ccf-cli
    profiles: ["cli"]
    depends_on:
      db: { condition: service_healthy }
    environment: *ccf_env
    entrypoint: ["ccf"]
    restart: "no"

  # Catalog currency poller. One-shot: `docker compose --profile poller up`.
  # Wrap in a host cron / scheduler for daily runs, or run it from CI on a
  # schedule to open a PR when a catalog drifts. `sources-seed` is idempotent;
  # `sources-check` records drift (it does not auto-mutate the curated catalog).
  poller:
    build: .
    container_name: ccf-poller
    profiles: ["poller"]
    depends_on:
      db:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment: *ccf_env
    entrypoint: ["sh", "-c"]
    command: ["ccf sources-seed && ccf sources-check"]
    restart: "no"

  # Evidence-prep worker. Preparation (parse -> screen -> expand -> classify ->
  # embed) is minutes of parsing and model calls per document -- far too slow
  # for a request cycle -- so it's queued in Postgres and drained here.
  # `docker compose --profile prep up -d prep-worker`.
  prep-worker:
    build: .
    container_name: ccf-prep-worker
    profiles: ["prep"]
    depends_on:
      db:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    # CCF_PREP_ENABLED overrides x-ccf-env's silence on it (prep_enabled
    # defaults to false -- the pipeline is opt-in). Without this, `ccf
    # prep-worker --loop` printed "disabled" and exited immediately every
    # cycle, and `restart: unless-stopped` below restart-looped the container
    # forever. Opting into the "prep" profile at all (this service only
    # starts via `docker compose --profile prep up`) is already the
    # operator's explicit signal they want the pipeline running, so this
    # override is scoped to this service rather than raised in x-ccf-env,
    # which would silently flip the default for every other service too.
    environment:
      <<: *ccf_env
      CCF_PREP_ENABLED: "true"
    entrypoint: ["sh", "-c"]
    command: ["ccf prep-worker --loop"]
    restart: "unless-stopped"

volumes:
  ccf_pgdata:
