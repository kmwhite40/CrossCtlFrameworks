name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint + typecheck + test (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccf
          POSTGRES_PASSWORD: ccf
          POSTGRES_DB: ccf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CCF_DATABASE_URL: postgresql+asyncpg://ccf:ccf@localhost:5432/ccf_test
      CCF_DATABASE_URL_SYNC: postgresql+psycopg://ccf:ccf@localhost:5432/ccf_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q --cov=ccf --cov-report=term-missing

  landing:
    name: lint + typecheck + build (landing)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web/landing }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: "npm", cache-dependency-path: web/landing/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run build

  supply-chain:
    name: sbom + vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -U pip cyclonedx-bom pip-audit
      - run: pip install -e .
      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
      - name: pip-audit
        # Blocking: dependency vulnerabilities fail the build. No allowlist —
        # the prior cryptography advisories (PYSEC-2026-35/36/2141,
        # GHSA-537c-gmf6-5ccf) are resolved by the cryptography>=46 pin in
        # pyproject.toml. Do not add --ignore-vuln without a comment justifying
        # that no fix is available within the current pins.
        # --skip-editable skips the local editable `ccf` package (not on PyPI,
        # not a real dependency). We drop --strict because --strict fails on the
        # skipped-editable package; pip-audit still exits non-zero on any real
        # dependency vulnerability, so the supply-chain gate remains blocking.
        run: pip-audit --skip-editable
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ccf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
