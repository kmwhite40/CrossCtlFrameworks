name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint + typecheck + test (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ccf
          POSTGRES_PASSWORD: ccf
          POSTGRES_DB: ccf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CCF_DATABASE_URL: postgresql+asyncpg://ccf:ccf@localhost:5432/ccf_test
      CCF_DATABASE_URL_SYNC: postgresql+psycopg://ccf:ccf@localhost:5432/ccf_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q --cov=ccf --cov-report=term-missing

  landing:
    name: lint + typecheck + build (landing)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web/landing }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: "npm", cache-dependency-path: web/landing/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run build

  supply-chain:
    name: sbom + vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -U pip cyclonedx-bom pip-audit
      - run: pip install -e .
      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
      - name: pip-audit
        # Blocking: dependency vulnerabilities fail the build. No allowlist —
        # the prior cryptography advisories (PYSEC-2026-35/36/2141,
        # GHSA-537c-gmf6-5ccf) are resolved by the cryptography>=46 pin in
        # pyproject.toml. Do not add --ignore-vuln without a comment justifying
        # that no fix is available within the current pins.
        # Audit the pinned third-party dependencies. Auditing the live
        # environment trips pip-audit's exit code on the local editable `ccf`
        # package (not on PyPI). Instead freeze the deps excluding editables and
        # audit that requirements file — clean exit, and pip-audit still fails on
        # any real dependency vulnerability, so the supply-chain gate stays
        # blocking.
        run: |
          pip freeze --exclude-editable > audit-reqs.txt
          pip-audit -r audit-reqs.txt
      # Install Trivy from Aqua's apt repo rather than aquasecurity/trivy-action:
      # the action's bundled install.sh fails deterministically fetching the
      # release binary in CI. The apt repo is maintained and has no GitHub
      # release-download / API-rate-limit path.
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Trivy fs scan
        # Same gate as before: block on fixable HIGH/CRITICAL filesystem findings.
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ccf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
